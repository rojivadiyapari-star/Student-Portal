<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Student Portal</h1>
    <p>Account Sign In</p>
  </header>

  <!-- Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="events.html">Events</a>
    <a href="faq.html">FAQ</a>
    <a href="feedback.html">Feedback</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About Us</a>
    <a href="login.html" class="active">Login</a>
  </nav>

  <!-- Main Content Container -->
  <main class="container">

    <div class="login-wrapper">
      <section class="card">
        <h2 style="text-align: center; border-bottom: none; margin-bottom: 20px;">Login</h2>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
          <div class="form-group">
            <label for="username">Username / Student ID</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username or ID" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: normal;">
              <input type="checkbox" id="rememberMe"> Remember me
            </label>
            <a href="faq.html" style="color: #174ea6; text-decoration: none;">Forgot password?</a>
          </div>

          <div class="form-actions" style="margin-top: 15px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Login</button>
            <button type="reset" class="btn btn-secondary">Clear</button>
          </div>
        </form>

        <div id="loginAlert" class="alert-box alert-success" style="margin-top: 15px; text-align: center;"></div>
      </section>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Student Portal. All Rights Reserved.</p>
  </footer>

  <script>
    function handleLoginSubmit(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const alertBox = document.getElementById('loginAlert');

      alertBox.textContent = 'Login successful! Welcome back, ' + username + '. Redirecting to Dashboard...';
      alertBox.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    }
  </script>

</body>
</html>
