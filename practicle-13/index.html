
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 13 - Student Records API</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 25px; color: #1e293b; }
        main { max-width: 950px; margin: auto; background: white; padding: 24px; border-radius: 10px; }
        input { padding: 10px; margin: 5px 0 12px; width: 100%; box-sizing: border-box; }
        button { padding: 9px 14px; margin: 3px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; }
        th { background: #dbeafe; }
        #message { padding: 10px; margin: 10px 0; }
        .error { color: #b91c1c; background: #fee2e2; }
        .success { color: #166534; background: #dcfce7; }
        #loading { color: #1d4ed8; }
    </style>
</head>
<body>
<main>
    <h1>Student Records Management</h1>
    <p>PHP JSON API with Fetch API</p>

    <div id="loading">Loading student records...</div>
    <div id="message" role="status"></div>

    <h2 id="formTitle">Add Student</h2>
    <form id="studentForm">
        <input type="hidden" id="studentId">
        <label for="name">Name</label>
        <input id="name" required maxlength="100">

        <label for="email">Email</label>
        <input id="email" type="email" required maxlength="150">

        <label for="course">Course</label>
        <input id="course" required maxlength="100">

        <button type="submit">Save Student</button>
        <button type="button" id="cancelEdit">Clear Form</button>
    </form>

    <h2>Student List</h2>
    <button type="button" id="refresh">Refresh List</button>

    <table>
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentList"></tbody>
    </table>
</main>
<script src="script.js"></script>
</body>
</html>
