    <h2 align="center">Feedback Form</h2>

    <p>Please share your feedback to help us improve the Student Portal.</p>

    <form>

        <label>Full Name:</label><br>
        <input type="text" name="fullname"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Department:</label><br>
        <input type="text" name="department"><br><br>

        <label>Rate the Student Portal:</label><br>
        <input type="radio" name="rating"> Excellent<br>
        <input type="radio" name="rating"> Good<br>
        <input type="radio" name="rating"> Average<br>
        <input type="radio" name="rating"> Poor<br><br>

        <label>Your Feedback:</label><br>
        <textarea name="feedback" rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">

    </form>
